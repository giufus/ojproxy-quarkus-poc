# Profilo "direct" — bypassa OJP, connessione PostgreSQL nativa.
# Attiva con: mvn quarkus:dev -Dquarkus.profile=direct  (oppure: just dev-product-direct)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/appdb
quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.username=product_svc
quarkus.datasource.password=product_svc
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.initial-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=2S
