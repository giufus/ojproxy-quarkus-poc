# HTTP ports
quarkus.http.port=8080
%test.quarkus.http.port=9091

# Datasource: all traffic goes through OJP. The native Postgres JDBC driver is
# NOT on the classpath, so we declare db-kind=other and pin everything manually.
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.openjproxy.jdbc.Driver
quarkus.datasource.jdbc.url=jdbc:ojp[localhost:1059]_postgresql://postgres:5432/appdb
quarkus.datasource.username=user_svc
quarkus.datasource.password=user_svc

# Hibernate must be told the dialect explicitly because db-kind=other.
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.database.default-schema=user_svc
# drop-and-create avoids the OJP ResultSet.getLong() ClassCastException that occurs when
# Hibernate's schema-update migrator queries information_schema.sequences (whose start_value
# column is VARCHAR, not bigint). drop-and-create uses a plain DDL creator path and does
# not introspect sequences. import.sql re-seeds the table after each (re)start.
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Disable Quarkus DevServices (we connect to the compose stack, not an ephemeral DB).
quarkus.datasource.devservices.enabled=false

# Agroal pool sized to fit under the OJP server's Hikari ceiling (see compose/ojp.env).
# Invariants: Agroal max-size <= OJP_MAX_CONNECTIONS; acquisition-timeout > OJP_CONNECTION_TIMEOUT;
# max-lifetime < Hikari maxLifetime (default 30M).
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.initial-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=2S
quarkus.datasource.jdbc.max-lifetime=25M
quarkus.datasource.jdbc.background-validation-interval=2M
