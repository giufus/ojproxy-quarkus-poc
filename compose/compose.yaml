services:
  postgres:
    image: postgres:16-alpine
    container_name: ojp-poc-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appadmin
      POSTGRES_PASSWORD: appadmin
      PG_MAX_CONNECTIONS: "25"        # abbassa per l'esperimento A/B; commenta per il default Postgres (100)
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-100}"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appadmin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ojp-poc-pgexporter
    environment:
      DATA_SOURCE_NAME: "postgresql://appadmin:appadmin@postgres:5432/appdb?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  ojp:
    image: rrobetti/ojp:0.4.14-beta
    container_name: ojp-poc-ojp
    env_file:
      - ./ojp.env
    ports:
      - "1059:1059"
      - "9159:9159"
    volumes:
      - ./ojp-libs:/opt/ojp/ojp-libs
    depends_on:
      postgres:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: ojp-poc-otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.6.0
    container_name: ojp-poc-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.2.0
    container_name: ojp-poc-loki
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: ojp-poc-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ojp-poc-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Editor"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  pgdata:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
